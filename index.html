<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpiPalace - Epidemiology Memory Palace</title>
    <!-- Tailwind CSS for UI HUD styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D graphics and first-person exploration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b131e; font-family: system-ui, -apple-system, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .hud-panel { background: rgba(16, 42, 67, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(40, 127, 131, 0.4); }
    </style>
</head>
<body>

    <!-- Main 3D Viewport -->
    <div id="canvas-container"></div>

    <!-- HUD Overlay -->
    <div class="absolute top-0 left-0 w-full p-6 pointer-events-none flex justify-between items-start text-white">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-teal-300">EPI-PALACE</h1>
            <p id="current-location" class="text-xs text-cyan-200 uppercase tracking-widest mt-1">Node 1: Entrance Foyer</p>
        </div>
        <div class="hud-panel p-4 rounded-xl pointer-events-auto shadow-2xl max-w-xs">
            <h2 class="text-sm font-semibold text-amber-300 mb-1">Navigation Controls</h2>
            <p class="text-xs text-slate-300 leading-relaxed">Click glowing nodes or pathways ahead to move through the chambers. Click interactive objects to inspect formulas.</p>
        </div>
    </div>

    <!-- Mnemonic / Formula Card Modal (Hidden by default) -->
    <div id="modal" class="absolute inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-6 z-50">
        <div class="hud-panel p-8 rounded-2xl max-w-md w-full shadow-2xl border-teal-500/50 text-white relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            <span id="modal-category" class="text-xs font-semibold text-teal-400 uppercase tracking-widest">Diagnostic Foyer</span>
            <h3 id="modal-title" class="text-xl font-bold text-amber-300 mt-1 mb-3">Formula Title</h3>
            <p id="modal-desc" class="text-sm text-slate-200 leading-relaxed mb-6">Formula breakdown and spatial mnemonic description goes here.</p>
            <div class="flex justify-between items-center pt-4 border-t border-slate-700/60">
                <span class="text-xs text-slate-400">Mastery Level: 0/5</span>
                <button onclick="closeModal()" class="bg-teal-700 hover:bg-teal-600 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors">Acknowledge & Return</button>
            </div>
        </div>
    </div>

    <!-- Core App Logic -->
    <script>
        // --- SCENERY & ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b131e);
        scene.fog = new THREE.FogExp2(0x0b131e, 0.035);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x17324D, 1.2);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x287F83, 2, 15);
        pointLight.position.set(0, 3, 0);
        scene.add(pointLight);

        // --- ROOM ARCHITECTURE (Entrance Node) ---
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // Floor
        const floorGeo = new THREE.PlaneGeometry(10, 15);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x102A43, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        roomGroup.add(floor);

        // Walls
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x17324D, roughness: 0.9 });
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 15), wallMat);
        leftWall.position.set(-5, 2, 0);
        roomGroup.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 15), wallMat);
        rightWall.position.set(5, 2, 0);
        roomGroup.add(rightWall);

        // --- INTERACTIVE LOCUS (The 2x2 Cell Core Object) ---
        const interactiveObjects = [];
        
        const locusGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const locusMat = new THREE.MeshStandardMaterial({ color: 0x287F83, roughness: 0.3, emissive: 0x102A43 });
        const locusMesh = new THREE.Mesh(locusGeo, locusMat);
        locusMesh.position.set(0, 1, -4);
        locusMesh.userData = { 
            title: "True Positive / False Positive (2x2 Cell Core)", 
            category: "Wing A: Diagnostics Foyer",
            desc: "The foundation of diagnostic testing. Anchored as the entrance bridge guardrails, separating disease presence from diagnostic detection." 
        };
        scene.add(locusMesh);
        interactiveObjects.push(locusMesh);

        // Floating ambient particles for atmosphere
        const particleCount = 200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for(let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 20;
            particlePositions[i+1] = Math.random() * 5;
            particlePositions[i+2] = (Math.random() - 0.5) * 20;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x287F83, size: 0.05, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- RAYCASTING & CLICK INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                showModal(data.title, data.category, data.desc);
            }
        });

        function showModal(title, category, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-category').innerText = category;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        // --- ANIMATION LOOP ---
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let elapsedTime = clock.getElapsedTime();
            
            // Gentle floating/pulsing of the interactive locus
            locusMesh.rotation.y = elapsedTime * 0.5;
            locusMesh.position.y = 1 + Math.sin(elapsedTime * 2) * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
